<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E141A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="country-hills-logo.png">
<title>Crew Board · Country Hills Golf Club</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230E141A'/%3E%3Cpath%20d='M12%2027V5l11%204.5L12%2014'%20fill='none'%20stroke='%236FAE6A'%20stroke-width='2.6'%20stroke-linejoin='round'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --night:#0E141A; --panel:#151D25; --stripe:#1A232C; --line:#28333E; --line2:#354351;
    --chalk:#E7EEF3; --mute:#7C8E9C; --dim:#66747F;
    --turf:#6FAE6A; --sand:#DDB268; --out:#E4674C; --pm:#63B8D4;
    --display:"Barlow Condensed","Arial Narrow",sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --gutter:180px;
    --cols:minmax(0,1.05fr) minmax(0,.95fr) minmax(0,.95fr);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  html.light{
    --night:#F2EFE7; --panel:#FCFBF7; --stripe:#EAE6DA; --line:#D8D2C2; --line2:#B9B09A;
    --chalk:#20262B; --mute:#5B6873; --dim:#77828C;
    --turf:#39763C; --sand:#8F6B14; --out:#BE3E22; --pm:#136F96;
    color-scheme:light;
  }
  html.light .tabs button[aria-selected=true]{color:#fff}
  html.light .crewbtn[data-on="1"]{color:#fff}
  html.light .pills button[data-on="1"]{color:#fff}
  html.light .datenav input[type=date]{color-scheme:light}
  html.light .pmcell input.pm::placeholder{color:rgba(19,111,150,.5)}
  html.light .pmcell input.j2::placeholder{color:rgba(143,107,20,.5)}
  html.light .slot input.txt::placeholder{color:#8A93A0}
  html.light .pickpanel,html.light .menu{box-shadow:0 18px 44px rgba(60,50,25,.22)}
  body{background:var(--night);color:var(--chalk);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
  button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--sand);outline-offset:2px}
  .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

  .bar{display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:11px 22px;background:var(--panel);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.13em;text-transform:uppercase;line-height:1;white-space:nowrap}
  .logo{height:34px;width:auto;display:block}
  .tvbar .logo{height:32px;align-self:center}
  .brand em{font-style:normal;color:var(--turf)}
  .brand small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--dim);margin-top:3px;font-weight:400}
  .vr{width:1px;height:30px;background:var(--line)}
  .datenav{display:flex;align-items:center;gap:4px}
  .datenav input[type=date]{background:var(--night);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-family:var(--mono);font-size:12.5px;color-scheme:dark}
  .icb{background:none;border:1px solid transparent;border-radius:4px;color:var(--mute);padding:4px 9px;font-size:17px;line-height:1}
  .icb:hover{color:var(--chalk);border-color:var(--line)}
  .crews{display:flex;align-items:center;gap:5px}
  .schedwarn{margin:0 22px 10px;padding:9px 13px;border:1px solid var(--sand);border-radius:7px;
    background:rgba(221,178,104,.10);color:var(--sand);font-size:13px;line-height:1.45}
  .schedwarn b{font-weight:600}
  .crewbtn{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--night);color:var(--dim);border-radius:4px;padding:5px 10px}
  .crewbtn[data-on="1"]{background:var(--turf);border-color:var(--turf);color:#0B1116;font-weight:600}
  .headcount{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.04em;white-space:nowrap}
  .headcount b{color:var(--chalk);font-weight:600}
  .spacer{flex:1}
  .tabs{display:flex;gap:2px;background:var(--night);border:1px solid var(--line);border-radius:5px;padding:2px}
  .tabs button{background:none;border:0;padding:5px 13px;border-radius:3px;font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .tabs button[aria-selected=true]{background:var(--chalk);color:#0B1116;font-weight:600}
  .btn{background:var(--night);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:13px}
  .btn:hover{border-color:var(--line2)}
  .btn.key{border-color:var(--sand);color:var(--sand)}
  .btn.go{border-color:var(--turf);color:var(--turf)}
  .syncpill{display:flex;align-items:center;gap:7px;background:none;border:1px solid var(--line);border-radius:99px;
    padding:5px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .syncpill:hover{border-color:var(--line2);color:var(--mute)}
  .syncpill i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:block}
  .syncpill.live i{background:var(--turf);box-shadow:0 0 7px rgba(111,174,106,.7)}
  .syncpill.live{color:var(--turf);border-color:rgba(111,174,106,.4)}
  .syncpill.bad i{background:var(--out)} .syncpill.bad{color:var(--out);border-color:rgba(228,103,76,.4)}
  .sql{font-family:var(--mono);font-size:11.5px;line-height:1.65;background:var(--night);border:1px solid var(--line);
    border-radius:6px;padding:12px 14px;overflow:auto;white-space:pre;color:var(--mute);margin:0 0 12px}

  /* phase strip */
  .ribbon{display:flex;align-items:center;gap:18px;min-height:40px;padding:7px 24px;flex-wrap:wrap;
    background:var(--panel);border-bottom:1px solid var(--line);z-index:10}
  .ribbon[hidden]{display:none}
  .phaseinfo{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--dim);flex:1;min-width:220px}
  .phaseinfo b{font-weight:600;color:var(--mute)}
  .phaseinfo b.redc{color:var(--out)} .phaseinfo b.pmc{color:var(--pm)}
  .preview{display:flex;align-items:center;gap:5px;flex:none}
  .preview span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-right:2px}
  .preview button{font-family:var(--mono);font-size:10px;background:var(--night);border:1px solid var(--line);color:var(--dim);border-radius:3px;padding:4px 8px}
  .preview button[aria-pressed=true]{color:var(--chalk);border-color:var(--line2)}

  /* direction of cut + shared note */
  .cutbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:10px 22px 12px;
    border-bottom:1px solid var(--line);background:var(--night)}
  .cuttl{font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--sand);align-self:center;margin-right:2px;font-weight:600}
  .cutf{display:flex;flex-direction:column;gap:3px}
  .cutf s{text-decoration:none;font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
  .cutf select{background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--chalk);padding:5px 8px;font-size:13px}
  .tod{width:100%;min-height:34px;border:1px solid var(--line);background:var(--panel);border-radius:5px;
    font-family:var(--mono);font-size:12px;color:var(--chalk);padding:4px 0}
  .tod[data-st=off]{opacity:.28;background:none;border-color:transparent}
  .tod[data-st=sel]{border-color:var(--sand);color:var(--sand);background:rgba(221,178,104,.12);font-weight:600}
  .tod[data-st=booked]{border-color:var(--turf);color:var(--turf);background:rgba(111,174,106,.14);font-weight:600}
  .tod:not([disabled]):hover{border-color:var(--line2)}
  .jgrip{cursor:grab;color:var(--dim);user-select:none;font-size:12px;padding:0 1px}
  /* employee profile */
  .phead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .phead h4{margin:0;font-size:23px;letter-spacing:.05em}
  .phead .meta{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.05em}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin:12px 0 4px}
  .stat{background:var(--night);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
  .stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;font-weight:600}
  .stat s{display:block;text-decoration:none;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);margin-top:3px}
  .stat.warn b{color:var(--out)} .stat.gold b{color:var(--sand)}
  .subtabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
  .subtabs button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;
    padding:5px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
  .subtabs button[aria-pressed=true]{border-color:var(--line2);color:var(--chalk);background:var(--night)}
  .trow{display:grid;grid-template-columns:minmax(0,1.4fr) 74px minmax(0,1fr) minmax(0,1fr) auto;
    gap:9px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
  .trow:last-child{border-bottom:0}
  .trow .mname{font-size:13.5px}
  .trow .ago{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .trow .ago.stale{color:var(--sand)}
  .trow .never{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--out)}
  .trow input[type=date],.trow input.by{background:var(--panel);border:1px solid var(--line);border-radius:5px;
    color:var(--chalk);padding:4px 7px;font-size:12px;width:100%;min-width:0}
  .trow.off .mname{color:var(--mute)}
  @media (max-width:800px){ .trow{grid-template-columns:1fr auto;gap:5px} .trow .ago,.trow .never{grid-column:1/-1} }
  .jmv{font-size:9px;flex:none}
  .cutf.note{flex:1;min-width:220px}
  .cutf.note input{background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--sand);padding:5px 9px;font-size:13px;width:100%}
  .jobdiv{height:9px;background:#04070A;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}

  /* board */
  .courses{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .course{background:var(--night);min-width:0}
  .chead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:16px 18px 13px;background:var(--panel)}
  .cname{font-family:var(--display);font-size:36px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;line-height:.9}
  .cname b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--turf);font-weight:500;margin-bottom:5px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
  .field input,.field select{background:var(--night);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
  .tt{font-family:var(--mono);font-weight:600;color:var(--sand);width:106px}
  .notes{width:100%;background:var(--night);border:1px solid var(--line);border-radius:4px;padding:6px 9px;resize:vertical;min-height:33px;line-height:1.4}

  .colhead{display:grid;grid-template-columns:var(--gutter) 1fr;border-top:2px solid var(--turf);border-bottom:1px solid var(--line);background:var(--night)}
  .course[data-course=talons] .colhead{border-top-color:var(--sand)}
  .course{display:flex;flex-direction:column}
  .course .job:last-child{flex:1}
  .course[data-course=talons] .cname b{color:var(--sand)}
  .colhead>div:first-child{padding:7px 12px 7px 18px}
  .colrest{display:grid;grid-template-columns:var(--cols);gap:10px;padding:7px 16px}
  .colhead span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .colhead .pmcell .j2lab{color:var(--sand)}
  .colhead .pmcell .pmlab{color:var(--pm);display:none}
  body.phase-pm .colhead .pmcell .j2lab{display:none}
  body.phase-pm .colhead .pmcell .pmlab{display:inline}

  .job{display:grid;grid-template-columns:var(--gutter) 1fr;border-bottom:1px solid var(--line)}
  .job:nth-of-type(odd){background:var(--panel)}
  .job:nth-of-type(even){background:var(--stripe)}
  .jlabel{padding:10px 14px 10px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
  .jlabel b{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    line-height:1.02;overflow-wrap:anywhere;hyphens:auto}
  .jlabel s{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;text-decoration:none;overflow-wrap:anywhere}
  .job.open .jlabel b{color:var(--sand)}
  .slots{padding:7px 16px 9px;display:flex;flex-direction:column;gap:5px;min-width:0}
  .slot{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:start;min-width:0}
  .namecell{display:flex;flex-direction:column;gap:3px;min-width:0}
  .slot select{width:100%;background:var(--night);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0}
  .slot select.empty{color:var(--dim)}
  .slot select.override{border-color:var(--out)}
  .slot input.txt{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);
    padding:5px 2px;font-size:14px;color:var(--chalk);min-width:0}
  .slot input.txt::placeholder{color:#4A5862}
  .slot input.txt:focus{border-bottom-color:var(--line2)}
  .pmcell{display:block}
  .pmcell input.j2{color:var(--sand);border-bottom-color:rgba(221,178,104,.30)}
  .pmcell input.j2::placeholder{color:rgba(221,178,104,.45)}
  .pmcell input.pm{color:var(--pm);border-bottom-color:rgba(99,184,212,.32);display:none}
  .pmcell input.pm::placeholder{color:rgba(99,184,212,.45)}
  body.phase-pm .pmcell input.j2{display:none}
  body.phase-pm .pmcell input.pm{display:block}
  .pick{width:100%;text-align:left;background:var(--night);border:1px solid var(--line);border-radius:4px;
    padding:5px 8px;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick:hover{border-color:var(--line2)}
  .pick.empty{color:var(--dim)}
  .pick.override{border-color:var(--out)}
  body.phase-half .pick.five{color:var(--out)}
  .pickpanel{position:fixed;z-index:70;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;
    box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column;max-height:min(64vh,460px)}
  .pickpanel .pf{border:0;border-bottom:1px solid var(--line);background:var(--night);padding:11px 13px;font-size:15px;width:100%}
  .pkbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--night)}
  .pkbar span{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);flex:1}
  .pkbar button{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;background:none;border:1px solid var(--line);
    color:var(--mute);border-radius:3px;padding:4px 8px}
  .pkbar button:hover{border-color:var(--line2);color:var(--chalk)}
  .pklist{overflow:auto;padding:5px}
  .pkgrp{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
    padding:9px 9px 5px}
  .pkgrp.warn{color:var(--sand)}
  .pkrow{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;
    border-radius:5px;padding:7px 9px;font-size:14.5px;color:var(--chalk)}
  .pkrow:hover,.pkrow.on{background:var(--stripe)}
  .pkrow.on{outline:1px solid var(--line2)}
  .pkrow b{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pkrow .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--dim);white-space:nowrap}
  .pkrow .meta.never{color:var(--sand)} .pkrow .meta.stale{color:var(--turf)} .pkrow .meta.warn{color:var(--out)}
  .pkempty{color:var(--dim);font-size:13px;padding:14px 10px}
  .menu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line2);border-radius:8px;
    box-shadow:0 18px 44px rgba(0,0,0,.55);padding:5px;min-width:190px}
  .menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:9px 11px;font-size:14px}
  .menu button:hover{background:var(--stripe)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
  .printhead{display:none}
  .flags{display:flex;gap:4px;flex-wrap:wrap}
  .flag{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid;border-radius:3px;padding:2px 5px;white-space:nowrap}
  .flag.train{border-color:var(--sand);color:var(--sand)}
  .flag.dup{border-color:var(--out);color:var(--out)}
  .flag.gone{border-color:var(--out);color:var(--out);background:rgba(228,103,76,.13)}
  .flag.cover{border-color:var(--turf);color:var(--turf)}
  .flag.late{border-color:var(--sand);color:var(--sand)}
  body.phase-half select.five{color:var(--out)}
  .addslot{align-self:flex-start;background:none;border:0;color:var(--dim);font-size:12px;padding:3px 0}
  .addslot:hover{color:var(--turf)}

  /* crew footer */
  .crewbar{display:grid;grid-template-columns:1.4fr 1.1fr 1fr .9fr;gap:24px;padding:16px 22px 30px;border-top:1px solid var(--line)}
  .chipn.sup-on{border-color:var(--turf);color:var(--turf)}
  .crewbar h4{font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 9px;font-weight:600}
  .crewbar h4 em{font-style:normal;color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.06em}
  .names{display:flex;flex-wrap:wrap;gap:6px}
  .chipn{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:var(--panel);color:var(--chalk)}
  .chipn:hover{border-color:var(--sand)}
  .chipn em{font-family:var(--mono);font-size:8.5px;font-style:normal;color:var(--dim)}
  .chipn em.late{color:var(--sand)}
  .chipn.basic{border-color:var(--turf);color:var(--turf)}
  .chipn.on{color:var(--mute);background:none;border-style:dashed}
  .chipn.away{border-color:rgba(228,103,76,.45);color:var(--out)}
  .chipn.away s{text-decoration:line-through;text-decoration-thickness:1px}
  .chipn.away em{color:var(--turf)}
  .empty-note{color:var(--dim);font-size:13px}

  /* modal */
  .veil{position:fixed;inset:0;background:rgba(6,10,14,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:20px 22px;width:min(430px,100%)}
  .modal h5{font-family:var(--display);font-size:24px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 3px;font-weight:600}
  .modal .sub{color:var(--mute);font-size:12.5px;margin:0 0 16px}
  .modal .opt{display:block;width:100%;text-align:left;background:var(--night);border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin-bottom:8px;font-size:14px}
  .modal .opt:hover{border-color:var(--line2)}
  .modal .opt b{display:block;font-size:14px;margin-bottom:2px}

/* theme is a per-computer preference — plain localStorage, never part of the shared board */
try{ if(localStorage.getItem("chgc-theme")==="light"){
  document.documentElement.classList.add("light");
  const mc=document.querySelector('meta[name=color-scheme]'); if(mc) mc.content="light";
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.content="#F2EFE7";

/* ══ storage: artifact (window.storage) → saved file (localStorage) → memory ══ */
const mem={};
const store={
  async get(k){
    if(window.storage){ try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; } }
    try{ return localStorage.getItem(k); }catch(e){ return mem[k]??null; }
  },
  async set(k,v){
    if(window.storage){ try{ await window.storage.set(k,v); return true; }catch(e){} }
    try{ localStorage.setItem(k,v); return true; }catch(e){ mem[k]=v; return false; }
  }
};

/* If this computer's storage ever fills (several seasons in), keep the recent days
   here and let the older ones live on the shared board. Nothing is deleted there. */
let diskWarned=false;
const KEEP_DAYS=220;
async function diskFull(){
  const shared=!!(state.sync&&state.sync.url&&state.sync.key);
  const keys=Object.keys(state.days).sort();
  if(shared&&keys.length>KEEP_DAYS){
    const drop=keys.slice(0,keys.length-KEEP_DAYS);
    drop.forEach(k=>delete state.days[k]);
    if(await store.set("chgc-board",JSON.stringify(state))){
      if(!diskWarned){ diskWarned=true;
        alert(`This computer ran out of room, so the oldest ${drop.length} days were cleared off it.\n\n`+
          `They're all still on the shared board and on the other computers — nothing was lost.`); }
      return;
    }
  }
  if(!diskWarned){ diskWarned=true;
    alert("This computer has run out of storage room, so changes can't be saved on it right now."+
      (shared?"\n\nThey are still going to the shared board, so nothing is lost."
             :"\n\nOpen Setup and download a backup now, then connect the shared board."));
  }
}

function mtParts(d){

      year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    const o={}; mtFmt.formatToParts(d||new Date()).forEach(x=>{ if(x.type!=="literal") o[x.type]=x.value; });
    return {y:+o.year,m:+o.month,d:+o.day,h:(+o.hour)%24,mi:+o.minute};

  const d=state.days[k]; d.late=d.late||{}; d.half=d.half||{}; d.early=d.early||{}; d.supsIn=d.supsIn||[]; d.note=d.note??""; d.cut=d.cut||defaultCut(); return d; }

/* ══ who's in ══ */
const CREWS=["1","2","3","MF"];
const crewLabel=c=>c==="MF"?"Mon\u2013Fri":"Crew "+c;
/* Crew MF works every weekday; 1/2/3 follow the rotating schedule. */
const crewWorksOn=(c,k)=>c==="MF"?[1,2,3,4,5].includes(dow(k)):(state.schedule[k]||[]).includes(c);
const crewsOn=k=>{ k=k||dateKey;
  const out=(state.schedule[k]||[]).slice();
  if(state.people.some(p=>p.crew==="MF")&&crewWorksOn("MF",k)) out.push("MF");
  return out; };
/* A person works a day if: their crew is on, or their own custom calendar says so,
   or (no crew, no custom) their weekday buttons include it. */
function worksOn(p,k){
  if(!p) return false;
  if(p.crew) return crewWorksOn(p.crew,k);
  if(p.custom&&Object.keys(p.custom).length) return !!p.custom[k];
  return (p.days||[]).includes(dow(k));
}
function scheduledToday(k){
  k=k||dateKey;
  const d=day(k), seen=new Set(), out=[];
  const push=p=>{ if(p&&!seen.has(p.id)){ seen.add(p.id); out.push(p); } };
  state.people.forEach(p=>{ if(worksOn(p,k)) push(p); });
  Object.keys(d.extra||{}).forEach(id=>push(person(id)));
  Object.values(d.away||{}).forEach(a=>{ if(a.by) push(person(a.by)); });
  return out;
}

/* A training record is either an old-style true/false, or {on,date,by} once a

const trainRec=(pid,m)=>{ const t=state.training[pid]; if(!t) return null;
  const v=t[m]; if(v===undefined||v===null) return null;
  return (typeof v==="object")?v:{on:!!v,date:"",by:""}; };

const setTrained=(pid,m,on,extra)=>{
  state.training[pid]=state.training[pid]||{};
  const old=trainRec(pid,m)||{on:false,date:"",by:""};
  const who=((state.sync||{}).who||"").trim();
  state.training[pid][m]= on
    ? {on:true, date:(extra&&extra.date!==undefined)?extra.date:(old.date||todayKey()),
       by:(extra&&extra.by!==undefined)?extra.by:(old.by||who)}

};
const daysAgo=k=>{ if(!k) return null;
  return Math.round((new Date(todayKey()+"T00:00:00")-new Date(k+"T00:00:00"))/86400000); };
const agoText=k=>{ const n=daysAgo(k); if(n===null) return "";
  if(n<=0) return "today"; if(n===1) return "yesterday";
  if(n<30) return n+" days ago"; if(n<365) return Math.round(n/30)+" months ago";
  const y=(n/365); return (y<1.5?"a year":Math.round(y)+" years")+" ago"; };

    (d[c].assign[j.id]||[]).forEach(s=>{ if(s&&s.p===fromId) s.p=toId; });

/* ══ clock ══ */
function toMin(v){
  if(!v) return null;
  const s=String(v).trim().toUpperCase();
  const ap=/P\.?M/.test(s)?"PM":/A\.?M/.test(s)?"AM":null;
  const dg=s.replace(/[^0-9:]/g,""); if(!dg) return null;
  let h,m;
  if(dg.includes(":")){ const p=dg.split(":"); h=+p[0]; m=+(p[1]||0); }
  else if(dg.length<=2){ h=+dg; m=0; }
  else { h=+dg.slice(0,dg.length-2); m=+dg.slice(-2); }
  if(isNaN(h)||isNaN(m)) return null;
  if(ap==="PM"&&h<12) h+=12;
  if(ap==="AM"&&h===12) h=0;
  if(!ap&&h<5) h+=12;
  return h*60+m;
}
function fmt(min){ let h=Math.floor(min/60),m=min%60,ap=h>=12?"PM":"AM"; h%=12; if(!h)h=12; return h+":"+pad(m)+" "+ap; }
const nowMin=()=>{ const p=mtParts(); return p.h*60+p.mi; };
function phase(){
  if(preview!=="live") return preview;
  if(dateKey!==todayKey()) return "am";
  const n=nowMin(),h=toMin(state.times.half),p=toMin(state.times.pm);
  if(p!==null&&n>=p) return "pm";
  if(h!==null&&n>=h) return "half";
  return "am";
}
function applyPhase(){
  const ph=phase();
  document.body.classList.toggle("phase-half",ph==="half"||ph==="pm");
  document.body.classList.toggle("phase-pm",ph==="pm");
}

/* ══ name picker ══
   Type to filter, arrow keys + Enter to pick. Shows how long since each
   person last did this job, so the same few names don't get it every day. */
let pickSort="az", pickOpen=null;

function sinceMap(label){
  const m={};
  Object.keys(state.days).forEach(k=>{
    if(k>=dateKey) return;
    const d=state.days[k];
    ["talons","ridge"].forEach(c=>state.jobs[c].forEach(j=>{
      if(j.label!==label) return;
      (d[c].assign[j.id]||[]).forEach(sl=>{ if(sl&&sl.p&&(!m[sl.p]||k>m[sl.p])) m[sl.p]=k; });
    }));
  });
  return m;
}
const daysBetween=(a,b)=>Math.round((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/86400000);
function matches(name,q){
  if(!q) return true;
  const n=name.toLowerCase(), t=q.toLowerCase().trim();
  if(!t) return true;
  return t.split(/\s+/).every(w=>n.split(/\s+/).some(part=>part.startsWith(w))||n.includes(w));
}
function closePicker(){ pickOpen=null; const p=document.getElementById("pickPanel"); if(p) p.remove(); }

function openPicker(btn){
  closePicker();
  const key=btn.dataset.pick, [c,jid,i]=key.split("|");
  const job=state.jobs[c].find(j=>j.id===jid); if(!job) return;
  const cur=((day()[c].assign[jid]||[])[+i]||{}).p||"";
  const since=sinceMap(job.label), roster=rosterToday();
  pickOpen={key,job,c,i:+i,cur,since,roster,q:"",idx:0};

  const panel=document.createElement("div");
  panel.className="pickpanel"; panel.id="pickPanel";
  document.body.appendChild(panel);
  const r=btn.getBoundingClientRect();
  const w=Math.max(288,Math.min(360,r.width+120));
  panel.style.width=w+"px";
  panel.style.left=Math.max(8,Math.min(window.innerWidth-w-8,r.left))+"px";
  const below=window.innerHeight-r.bottom;
  if(below>250) panel.style.top=(r.bottom+4)+"px";
  else { panel.style.bottom=(window.innerHeight-r.top+4)+"px"; panel.style.maxHeight=Math.max(200,r.top-16)+"px"; }
  drawPicker();
  const f=panel.querySelector(".pf"); if(f) f.focus();
}

function pickCandidates(){
  const {job,since,roster,q,cur}=pickOpen;
  const list=roster.filter(p=>matches(p.name,q));
  const rank=p=>{ const k=since[p.id]; return k?daysBetween(dateKey,k):9999; };
  const sorter=pickSort==="since"
    ? (a,b)=>rank(b)-rank(a)||a.name.localeCompare(b.name)
    : (a,b)=>a.name.localeCompare(b.name);
  const yes=list.filter(p=>isTrained(p.id,job.req)).sort(sorter);
  const no=list.filter(p=>!isTrained(p.id,job.req)).sort(sorter);
  return {yes,no,flat:yes.concat(no)};
}
function metaFor(p){
  const {since,key,job}=pickOpen;
  const bits=[];
  const also=assignedElsewhere(p.id,key);
  if(also.length) bits.push(`<span class="meta warn">on ${esc(also[0])}</span>`);
  if(p.hours===5) bits.push(`<span class="meta">5H</span>`);
  const k=since[p.id];
  if(!k) bits.push(`<span class="meta never">never</span>`);
  else { const d=daysBetween(dateKey,k); bits.push(`<span class="meta ${d>=14?"stale":""}">${d}d</span>`); }
  return bits.join("");
}
function drawPicker(){
  const panel=document.getElementById("pickPanel"); if(!panel||!pickOpen) return;
  /* the redraw rebuilds the filter box — keep the cursor where it was or typing comes out backwards */
  const prev=panel.querySelector(".pf");
  const caret=prev&&document.activeElement===prev?prev.selectionStart:null;
  const {yes,no,flat}=pickCandidates(), {job,cur,q}=pickOpen;
  if(pickOpen.idx>=flat.length) pickOpen.idx=Math.max(0,flat.length-1);
  const row=(p,n)=>`<button class="pkrow ${n===pickOpen.idx?"on":""} ${cur===p.id?"cur":""}" data-p="${p.id}">
      <b>${esc(p.name)}</b>${metaFor(p)}</button>`;
  let n=-1;
  panel.innerHTML=`
    <input class="pf" placeholder="Type a name…" value="${esc(q)}">
    <div class="pkbar"><span>${esc(job.label)}${job.req?" · "+esc(job.req):""}</span>
      <button data-sort>${pickSort==="az"?"A–Z":"Longest since"}</button>
      ${cur?`<button data-clear>Clear</button>`:""}</div>
    <div class="pklist">
      ${yes.length?`<div class="pkgrp">Signed off</div>${yes.map(p=>row(p,++n)).join("")}`:""}
      ${no.length?`<div class="pkgrp warn">Not signed off${job.req?" — "+esc(job.req):""}</div>${no.map(p=>row(p,++n)).join("")}`:""}
      ${!flat.length?`<div class="pkempty">Nobody in today matches that.</div>`:""}
    </div>`;
  const f=panel.querySelector(".pf");
  if(caret!==null){ f.focus(); try{ f.setSelectionRange(caret,caret); }catch(e){} }
  f.oninput=()=>{ pickOpen.q=f.value; pickOpen.idx=0; drawPicker(); };
  f.onkeydown=e=>{
    const {flat}=pickCandidates();
    if(e.key==="ArrowDown"){ e.preventDefault(); pickOpen.idx=Math.min(flat.length-1,pickOpen.idx+1); drawPicker(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); pickOpen.idx=Math.max(0,pickOpen.idx-1); drawPicker(); }
    else if(e.key==="Enter"){ e.preventDefault(); if(flat[pickOpen.idx]) choose(flat[pickOpen.idx].id); }
    else if(e.key==="Escape"){ e.preventDefault(); closePicker(); }
  };
  const so=panel.querySelector("[data-sort]");
  if(so) so.onclick=()=>{ pickSort=pickSort==="az"?"since":"az"; drawPicker(); panel.querySelector(".pf").focus(); };
  const cl=panel.querySelector("[data-clear]");
  if(cl) cl.onclick=()=>choose("");
  panel.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>choose(b.dataset.p));
  const sel=panel.querySelector(".pkrow.on"); if(sel&&sel.scrollIntoView) sel.scrollIntoView({block:"nearest"});
}
function choose(id){

}

/* ══ copy a previous day ══ */
function copyFrom(k){
  const src=state.days[k]; if(!src) return {moved:0,dropped:0};
  const d=day(), have=new Set(rosterToday().map(p=>p.id));
  let moved=0,dropped=0;
  ["talons","ridge"].forEach(c=>state.jobs[c].forEach(j=>{
    const arr=src[c].assign[j.id]||[];
    if(!arr.length) return;
    d[c].assign[j.id]=arr.map(sl=>{
      if(!sl||!sl.p) return {p:"",note:(sl&&sl.note)||"",note2:(sl&&sl.note2)||"",pm:""};
      if(have.has(sl.p)){ moved++; return {p:sl.p,note:sl.note||"",note2:sl.note2||"",pm:""}; }
      dropped++; return {p:"",note:sl.note||"",note2:sl.note2||"",pm:""};
    });
  }));
  return {moved,dropped};
}

/* Two managers each importing their own copy of the crew list is the likeliest
   way this board gets messy, so watch for the same person listed twice. */
/* norm() strips spaces, so use a word-aware split for name comparisons */
const nameWords=n=>String(n).toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(Boolean);
const firstOf=n=>nameWords(n)[0]||"";
const lastOf=n=>{ const p=nameWords(n); return p.length>1?p[p.length-1]:""; };
function findDupes(){
  const out=[], used=new Set(), people=state.people;
  for(let i=0;i<people.length;i++){
    if(used.has(people[i].id)) continue;
    const grp=[people[i]];
    for(let j=i+1;j<people.length;j++){
      if(used.has(people[j].id)) continue;
      const a=people[i], b=people[j];
      if(a.dupOk&&b.dupOk) continue;
      const na=norm(a.name), nb=norm(b.name);
      const la=lastOf(a.name), lb=lastOf(b.name), sameLast=!!la&&la===lb;
      const fa=firstOf(a.name), fb=firstOf(b.name);
      const firstish=!!fa&&!!fb&&(fa===fb||fa.startsWith(fb)||fb.startsWith(fa)||(sameLast&&fa[0]===fb[0]));
      const contained=!!na&&!!nb&&na!==nb&&(na.includes(nb)||nb.includes(na));
      if(na===nb||(sameLast&&firstish)||contained){ grp.push(b); used.add(b.id); }
    }
    if(grp.length>1){ used.add(people[i].id); out.push(grp); }
  }
  return out;
}
function mergePeople(keepId,dropId){
  const keep=person(keepId), drop=person(dropId);
  if(!keep||!drop||keep.id===drop.id) return;
  keep.crew=keep.crew||drop.crew;
  if(drop.hours===5) keep.hours=5;
  keep.days=[...new Set([...(keep.days||[]),...(drop.days||[])])].sort();
  if(drop.custom) keep.custom=Object.assign({},drop.custom,keep.custom||{});
  const dt=state.training[drop.id]||{};
  state.training[keep.id]=state.training[keep.id]||{};
  const detail=v=>{ if(v===undefined||v===null) return -1;
    if(typeof v!=="object") return 0;
    return (v.date?1:0)+(v.by?1:0); };
  Object.keys(dt).forEach(m=>{
    const incoming=dt[m], cur=state.training[keep.id][m];
    const incOn=(typeof incoming==="object")?!!incoming.on:!!incoming;
    const curOn=(cur===undefined)?false:((typeof cur==="object")?!!cur.on:!!cur);
    /* signed off on either side wins; between two sign-offs keep the one that
       actually records who and when */
    if(incOn&&!curOn) state.training[keep.id][m]=incoming;
    else if(incOn&&curOn&&detail(incoming)>detail(cur)) state.training[keep.id][m]=incoming;
    else if(cur===undefined) state.training[keep.id][m]=incoming;
  });
  delete state.training[drop.id];
  Object.values(state.days).forEach(d=>{
    ["talons","ridge"].forEach(c=>Object.values((d[c]||{}).assign||{}).forEach(a=>a.forEach(sl=>{
      if(sl&&sl.p===drop.id) sl.p=keep.id; })));
    ["away","extra","late","half","early"].forEach(key=>{
      const box=d[key]; if(!box) return;
      if(box[drop.id]!==undefined&&box[keep.id]===undefined) box[keep.id]=box[drop.id];
      delete box[drop.id];
    });
    Object.values(d.away||{}).forEach(a=>{ if(a&&a.by===drop.id) a.by=keep.id; });
  });
  state.people=state.people.filter(p=>p.id!==drop.id);
  save();
}

function askSignoff(pid,m,after){
  const p=person(pid); if(!p) return;
  const rec=trainRec(pid,m)||{date:todayKey(),by:""};
  const who=((state.sync||{}).who||"").trim();
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="veil" id="veil"><div class="modal">
    <h5>${esc(p.name)} \u2014 ${esc(m)}</h5>
    <p class="sub">Signed off. Add who trained them and when, or skip it \u2014 either way it's recorded.</p>
    <div class="rowline"><label class="cutf" style="flex:1"><s>Trained by</s>
      <input type="text" id="sfBy" value="${esc(rec.by||who)}" placeholder="who signed them off"></label></div>
    <div class="rowline"><label class="cutf" style="flex:1"><s>When</s>
      <input type="date" id="sfDate" value="${esc(rec.date||todayKey())}"></label></div>
    <div class="foot"><button class="btn" id="sfSkip">Skip</button><button class="btn go" id="sfSave">Save</button></div>
  </div></div>`;
  const close=()=>{ root.innerHTML=""; if(after) after(); };
  document.getElementById("veil").onclick=e=>{ if(e.target.id==="veil") close(); };
  document.getElementById("sfSkip").onclick=close;
  document.getElementById("sfSave").onclick=()=>{
    setTrained(pid,m,true,{by:document.getElementById("sfBy").value.trim(),
      date:document.getElementById("sfDate").value||todayKey()});
    save(); close();
  };
  const f=document.getElementById("sfBy"); if(f) f.focus();
}

/* ══ people — one employee at a time, so the detail has room to breathe ══ */
function personStats(pid){
  const s={days:0,late:0,early:0,call:0,no:0,cover:0,off:0};
  Object.values(state.days).forEach(d=>{
    let worked=false;
    ["talons","ridge"].forEach(c=>Object.values(d[c].assign||{}).forEach(a=>a.forEach(sl=>{ if(sl&&sl.p===pid) worked=true; })));
    if(worked) s.days++;
    const a=(d.away||{})[pid];
    if(a){ if(a.type==="timeoff") s.off++; else if(a.type==="noshow") s.no++; else if(a.by) s.cover++; else s.call++; }
    if((d.late||{})[pid]) s.late++;
    if((d.early||{})[pid]||(d.half||{})[pid]) s.early++;
  });
  return s;
}
/* every sign-off records who did it, so we can read it back the other way */
function trainedByName(name){
  const n=norm(name||""); if(!n) return [];
  const out=[];
  state.people.forEach(p=>state.machines.forEach(m=>{
    const r=trainRec(p.id,m);
    if(r&&r.on&&r.by&&norm(r.by)===n) out.push({pid:p.id,who:p.name,machine:m,date:r.date||""});
  }));
  return out.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
function trainerTally(){
  /* group on the normalised name so "Keith Richards" and "keith  richards" are
     one person, then show whichever spelling was used most */
  const map={};
  state.people.forEach(p=>state.machines.forEach(m=>{
    const r=trainRec(p.id,m);
    if(!r||!r.on||!r.by) return;
    const raw=r.by.trim(); if(!raw) return;
    const k=norm(raw); if(!k) return;
    const e=map[k]=map[k]||{n:0,people:new Set(),last:"",spellings:{}};
    e.n++; e.people.add(p.id); if((r.date||"")>e.last) e.last=r.date||"";
    e.spellings[raw]=(e.spellings[raw]||0)+1;
  }));
  return Object.values(map).map(v=>({
    name:Object.entries(v.spellings).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length)[0][0],
    n:v.n,people:v.people.size,last:v.last}))
    .sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
}
function scheduleWord(p){
  if(p.crew) return crewLabel(p.crew);
  if(p.custom&&Object.keys(p.custom).length) return "own calendar";
  const names=(p.days||[]).map(i=>DN[i]).join(" ");
  return names||"no days set";
}

/* ══ history ══ */
function renderHistory(){
  const el=document.getElementById("viewHistory");
  const keys=Object.keys(state.days).filter(k=>hasContent(state.days[k])).sort().reverse();
  const rows=keys.slice(0,90).map(k=>{
    const d=state.days[k], filled=countFilled(d);
    const aents=Object.values(d.away||{});
    const offN=aents.filter(a=>a.type==="timeoff").length;
    const covN=aents.filter(a=>a.by&&a.type!=="timeoff").length;
    const callN=aents.length-offN-covN;
    return `<tr><td class="d">${k}</td>
      <td>${new Date(k+"T00:00:00").toLocaleDateString(undefined,{weekday:"short"})}</td>
      <td>${(state.schedule[k]||[]).map(c=>"Crew "+c).join(", ")||"—"}</td>
      <td>${rosterToday(k).length}</td><td>${filled}</td>
      <td>${aents.length?[callN?`<span style="color:var(--out)">${callN} called in</span>`:"",

      <td>${d.supsIn&&d.supsIn.length?esc(d.supsIn.join(", "))

    new Set([...Object.keys(d.early||{}),...Object.keys(d.half||{})]).forEach(id=>{ if(stats[id]) stats[id].early++; });

  const sorted=state.people.slice().sort((a,b)=>{

  el.querySelector("#statSort").onchange=e=>{ statSort=e.target.value; renderHistory(); };

  el.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{
    dateKey=b.dataset.goto; view="board";
    document.querySelectorAll("[data-view]").forEach(x=>x.setAttribute("aria-selected",x.dataset.view==="board"));

function countFilled(d){
  let n=0;
  ["talons","ridge"].forEach(c=>Object.values(d[c].assign||{}).forEach(a=>a.forEach(s=>{ if(s&&s.p) n++; })));
  return n;
}
function hasContent(d){
  return countFilled(d)>0||Object.keys(d.away||{}).length>0||(d.supsIn&&d.supsIn.length>0)
    ||d.talons.notes||d.ridge.notes||d.talons.tee||d.ridge.tee;
}

async function loadXLSX(){
  if(window.XLSX) return true;
  await new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=res; s.onerror=rej; document.head.appendChild(s); }).catch(()=>{});
  return !!window.XLSX;
}
async function fileRows(inputId){
  const f=document.getElementById(inputId).files[0];
  if(!f){ alert("Pick the file first."); return null; }
  if(!await loadXLSX()){ alert("The spreadsheet reader didn't load — this computer may be offline. Save the sheet as CSV and try again."); return null; }
  const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array"});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false});
  if(!rows.length){ alert("That sheet came through empty."); return null; }
  return rows;
}
function applyTrainingRows(rows){
  /* a real sheet can list the same machine twice, or leave a blank column —
     keep one column per name and count a Y in any of them */
  const raw=(rows[0]||[]).slice(1).map(h=>String(h||"").trim());
  const machines=[]; raw.forEach(h=>{ if(h&&machines.indexOf(h)<0) machines.push(h); });
  if(!machines.length) return "No machine names found in row 1.";
  const body=rows.slice(1).map(r=>({name:String(r[0]||"").trim(),r})).filter(x=>x.name);
  /* names in the sheet that aren't on the crew list — usually people who don't work here anymore */
  const unknown=body.filter(x=>!state.people.find(p=>norm(p.name)===norm(x.name))).map(x=>x.name);
  let addUnknown=false;
  if(unknown.length) addUnknown=confirm(
    `${unknown.length} name${unknown.length===1?"":"s"} in the sheet ${unknown.length===1?"isn't":"aren't"} on the crew list:\n${unknown.join(", ")}\n\n`+
    `OK — add them (new hires).\nCancel — skip them (people who don't work here anymore).`);
  state.machines=machines;
  let added=0,matched=0;
  body.forEach(({name,r})=>{
    let p=state.people.find(x=>norm(x.name)===norm(name));
    if(!p){ if(!addUnknown) return;
      p={id:uid(),name,crew:null,days:[1,2,3,4,5],hours:8}; state.people.push(p); added++; }
    else matched++;
    state.training[p.id]={};
    machines.forEach(m=>state.training[p.id][m]=false);
    raw.forEach((h,i)=>{ if(!h) return; const v=String(r[i+1]||"").trim().toUpperCase();
      if(v==="Y"||v==="YES"||v==="X"||v==="TRUE"||v==="1") state.training[p.id][h]=true; });
  });
  state.trainingIsSample=false; save();
  const notInSheet=state.people.filter(p=>!body.find(x=>norm(x.name)===norm(p.name))).map(p=>p.name);
  const missing=[...new Set(["talons","ridge"].flatMap(c=>state.jobs[c].map(j=>j.req).filter(rq=>rq&&!machines.includes(rq))))];
  return `Imported ${machines.length} machines.\n${matched} name${matched===1?"":"s"} matched, ${added} added`
    +(unknown.length&&!addUnknown?`, ${unknown.length} skipped`:"")+`.`
    +(notInSheet.length?`\n\nOn the crew list but not in this sheet (their boxes start unticked): ${notInSheet.join(", ")}.`:"")
    +(missing.length?`\n\nThese job rows check machine names that aren't in this sheet, so nobody shows as signed off for them:\n${missing.join(", ")}\nFix them under Setup → job rows.`:"");
}

}
/* crew list import — reads columns headed Crew 1/2/3, or two columns: name then crew */
function applyCrewRows(rows){
  /* Real sheets come in every shape. Handle: columns headed Crew 1/2/3, a name
     column plus a crew column, a plain list of names, title rows above the
     headers, extra columns, and crew written as "1", "Crew 1", "C1" or "Mon-Fri". */
  const clean=v=>String(v??"").replace(/\s+/g," ").trim();
  const crewFrom=v=>{ const t=clean(v).toLowerCase(); if(!t) return null;
    if(/(^|[^a-z])(m-?f|mon\s*-?\s*fri|monday\s*-?\s*friday|weekday)/.test(t)) return "MF";
    const m=t.match(/([123])/); return m?m[1]:null; };
  const hoursFrom=v=>{ const t=clean(v).toLowerCase(); if(!t) return null;
    if(/^5|half|1\/2|\bhalf\b/.test(t)) return 5; if(/^8|full/.test(t)) return 8; return null; };
  const looksLikeName=v=>{ const t=clean(v);
    return !!t && /[a-z]/i.test(t) && !/^(name|crew|employee|staff|full name|hours|shift|position|notes?)\b/i.test(t)
      && !crewFrom(t) && t.length<60; };

  const grid=rows.map(r=>Array.isArray(r)?r.map(clean):[clean(r)]);
  const pairs=[]; let mode="";

  /* shape A — a row whose cells are mostly crew headings */
  let headIdx=-1;
  grid.forEach((r,i)=>{ if(headIdx>=0) return;
    const crewCells=r.filter(c=>c&&crewFrom(c)&&/crew|m-?f|mon/i.test(c)).length;
    if(crewCells>=2) headIdx=i; });
  if(headIdx>=0){
    mode="columns";
    const map=grid[headIdx].map(c=>crewFrom(c));
    grid.slice(headIdx+1).forEach(r=>r.forEach((cell,i)=>{
      if(looksLikeName(cell)&&map[i]) pairs.push({name:cell,crew:map[i],hours:null}); }));
  }

  /* shape B — a name column, optionally with crew and hours columns beside it */
  if(!pairs.length){
    let hdr=-1, nameCol=0, crewCol=-1, hoursCol=-1;
    grid.forEach((r,i)=>{ if(hdr>=0) return;
      const idxName=r.findIndex(c=>/^(name|full name|employee|staff)\b/i.test(c));
      const idxCrew=r.findIndex(c=>/^crew\b/i.test(c));
      if(idxName>=0||idxCrew>=0){ hdr=i;
        if(idxName>=0) nameCol=idxName;
        crewCol=idxCrew;
        hoursCol=r.findIndex(c=>/^(hours|hrs|shift)\b/i.test(c)); } });
    const body=hdr>=0?grid.slice(hdr+1):grid;
    body.forEach(r=>{
      const nm=r[nameCol]!==undefined&&looksLikeName(r[nameCol])?r[nameCol]:(r.find(looksLikeName)||"");
      if(!nm) return;
      let crew=crewCol>=0?crewFrom(r[crewCol]):null;
      if(!crew&&crewCol<0){ for(let i=0;i<r.length;i++){ if(r[i]===nm) continue;
        const c=crewFrom(r[i]); if(c){ crew=c; break; } } }
      const hrs=hoursCol>=0?hoursFrom(r[hoursCol]):null;
      pairs.push({name:nm,crew,hours:hrs});
    });
    mode=mode||"rows";
  }

  if(!pairs.length) return "Couldn't find any names in that file. A single column of names works, "
    +"or add a Crew column beside it, or columns headed Crew 1 / Crew 2 / Crew 3.";

  let matched=0,added=0; const seen=new Set(); const dupes=new Set();
  pairs.forEach(({name,crew,hours})=>{
    let p=state.people.find(x=>norm(x.name)===norm(name));
    if(p){ if(seen.has(p.id)) dupes.add(p.name); else matched++;
      if(crew) p.crew=crew; if(hours) p.hours=hours; }
    else { p={id:uid(),name,crew:crew||null,days:[1,2,3,4,5],hours:hours||8};
      state.training[p.id]={};
      state.machines.forEach(m=>{ if((state.basics||[]).includes(m)) setTrained(p.id,m,true,{by:"",date:""}); });
      state.people.push(p); added++; }
    seen.add(p.id);
  });
  const gone=state.people.filter(p=>!seen.has(p.id));
  let removed=0;
  if(gone.length&&confirm(
    `${gone.length} name${gone.length===1?"":"s"} on the board ${gone.length===1?"isn't":"aren't"} in this crew list:\n${gone.map(p=>p.name).join(", ")}\n\n`+
    `OK — remove them (they don't work here anymore).\nCancel — keep them.`)){
    gone.forEach(p=>{ delete state.training[p.id]; });
    state.people=state.people.filter(p=>seen.has(p.id));
    removed=gone.length;
  }
  save();
  const noCrew=state.people.filter(p=>!p.crew).length, dz=findDupes();
  return `Crew list read: ${matched} matched, ${added} added${removed?`, ${removed} removed`:""}.`
    +(dz.length?`\n\nHeads up — ${dz.length} name${dz.length===1?"":"s"} may already be on the board under a slightly different spelling `
      +`(${dz.map(g=>g.map(p=>p.name).join(" / ")).join("; ")}). There's a box just below the crew list to sort that out.`:"")
    +(noCrew?`\n${noCrew} ${noCrew===1?"person has":"people have"} no crew — set their days in Setup or on their profile.`:"")
    +(dupes.size?`\n\nListed more than once, so only counted once: ${[...dupes].join(", ")}.`:"");
}

function shiftMonth(m,n){ const [y,mo]=m.split("-").map(Number); const d=new Date(y,mo-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function renderCal(){

  let cells=DN.map((d,i)=>`<div class="dowl">${DF[i].slice(0,3)}</div>`).join("");
  for(let i=0;i<first;i++) cells+=`<div class="cell blank"></div>`;
  for(let d=1;d<=last;d++){

    cells+=`<div class="cell ${k===todayKey()?"today":""}"><div class="dn">${d}</div><div class="pills">
      ${["1","2","3"].map(c=>`<button data-sc="${k}|${c}" data-on="${on.includes(c)?1:0}">${c}</button>`).join("")}

    b.dataset.on=state.schedule[k].includes(c)?1:0; save(); updateHead(); });
}
async function importSchedule(){
  const f=document.getElementById("schedFile").files[0];
  if(!f){ alert("Pick the schedule file first."); return; }
  if(!await loadXLSX()){ alert("The spreadsheet reader didn't load — this computer may be offline."); return; }
  const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array"});
  const COLS={0:0,2:1,4:2,6:3,8:4,10:5,12:6};
  const num=v=>{ const t=String(v??"").trim(); return /^\d{1,2}(\.0)?$/.test(t)&&+t>=1&&+t<=31?parseInt(t,10):null; };
  let found=0, months=0; const touched=new Set();
  wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:true,defval:""});
    const title=String((rows[0]||[])[0]||"");
    const mi=MN.findIndex(n=>title.toLowerCase().includes(n.toLowerCase()));
    const ym=title.match(/(20\d\d)/);
    if(mi<0||!ym) return;
    months++;
    const yr=+ym[1], mo=mi+1; let cur={}, last=0;
    rows.forEach(r=>{
      const nums={}, crews=[];
      Object.entries(COLS).forEach(([ci,wd])=>{
        const v=r[+ci]; const n=num(v);
        if(n!==null) nums[wd]=n;
        else if(typeof v==="string"&&v.trim().toLowerCase().startsWith("crew")) crews.push([wd,v.trim().slice(-1)]);
      });
      if(Object.keys(nums).length&&!crews.length){
        cur={}; Object.keys(nums).sort((a,b)=>a-b).forEach(wd=>{
          const d=nums[wd]; if(last>20&&d<8) return; cur[wd]=d; last=Math.max(last,d); });
        return;
      }
      crews.forEach(([wd,c])=>{
        if(cur[wd]===undefined) return;
        const k=`${yr}-${pad(mo)}-${pad(cur[wd])}`;
        if(!touched.has(k)){ touched.add(k); state.schedule[k]=[]; }
        if(!state.schedule[k].includes(c)) state.schedule[k].push(c);
        found++;
      });
    });
  });
  if(!months){ alert("Couldn't find a month title like \"July 2026\" in cell A1 of any sheet."); return; }
  Object.keys(state.schedule).forEach(k=>state.schedule[k].sort());
  save(); renderCal(); updateHead();
  alert(`Read ${months} month${months===1?"":"s"} of schedule.`);
}
function jobOf(k){ const [c,id]=k.split("|"); return state.jobs[c].find(j=>j.id===id); }

/* ══ shared board ══
   Off by default: saves to this computer only. Connected, every office PC
   reads and writes the same records. One record per day plus one config
   record, so different days never overwrite each other. */
const CFG_KEYS=["machines","people","supervisors","training","trainingIsSample","schedule","times","jobs"];
let lastSent={}, lastPull="1970-01-01T00:00:00Z", syncState="off", syncSeen=null, pullTimer=null, applyQueued=false;
/* have we actually checked the shared board yet, and did it hold a real roster? */
let pulledOnce=false, serverHasRoster=false, skipNextConfig=false;
/* set while a device is joining, so its first pull can protect local work */
let joining=false, keepSups=null, replacedDays=[];

const syncOn=()=>!!(state&&state.sync&&state.sync.url&&state.sync.key);
const configPart=()=>Object.fromEntries(CFG_KEYS.map(k=>[k,state[k]]));
/* forgiving on purpose: people paste the URL straight off the Data API page,
   which ends in /rest/v1/ — accept it either way */
function api(path){ return state.sync.url.replace(/\/+$/,"").replace(/\/rest\/v1$/,"")+"/rest/v1/"+path; }
function heads(extra){
  return Object.assign({apikey:state.sync.key,Authorization:"Bearer "+state.sync.key,
    "Content-Type":"application/json"},extra||{});
}
function setSync(st){ syncState=st; syncStatus(); }
function syncStatus(){
  const el=document.getElementById("syncPill"); if(!el) return;
  if(!syncOn()){ el.className="syncpill"; el.innerHTML=`<i></i>This computer only`; return; }
  if(syncState==="error"){ el.className="syncpill bad"; el.innerHTML=`<i></i>Sync failed — working offline`; return; }
  const ago=syncSeen?Math.round((Date.now()-syncSeen)/1000):null;
  el.className="syncpill live";
  el.innerHTML=`<i></i>Shared${ago!==null?` · ${ago<60?ago+"s":Math.round(ago/60)+"m"} ago`:""}`;
}
function editing(){
  const a=document.activeElement;
  return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
async function pushDirty(){
  if(!syncOn()) return;
  const recs=[], who=(state.sync.who||"").trim()||"unknown";
  const cfg=JSON.stringify(configPart());
  /* an empty copy must never overwrite a real roster on the server. But once we've
     looked and the shared board is empty too, this device is free to set things up. */
  if((state.people.length||(pulledOnce&&!serverHasRoster))&&lastSent.config!==cfg)
    recs.push({id:"config",data:JSON.parse(cfg),updated_by:who});
  Object.keys(state.days).forEach(k=>{
    const d=state.days[k];
    /* opening the board creates a blank record for that date — don't share those,
       an empty day landing on someone else's screen would wipe their work */
    if(!hasContent(d)&&lastSent["day:"+k]===undefined) return;
    const str=JSON.stringify(d);
    if(lastSent["day:"+k]!==str) recs.push({id:"day:"+k,data:d,updated_by:who});
  });
  if(!recs.length) return;
  try{
    const r=await fetch(api("board"),{method:"POST",
      headers:heads({Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(recs)});
    if(!r.ok) throw new Error(await r.text());
    recs.forEach(x=>{ lastSent[x.id]=JSON.stringify(x.data); });
    syncSeen=Date.now(); setSync("ok");
  }catch(e){ setSync("error"); }
}
async function pullChanges(){
  if(!syncOn()) return;
  try{
    const r=await fetch(api("board?select=id,data,updated_at&updated_at=gt."+encodeURIComponent(lastPull)),{headers:heads()});
    if(!r.ok) throw new Error(await r.text());
    const rows=await r.json();
    syncSeen=Date.now(); setSync("ok"); pulledOnce=true;
    let changed=false;
    rows.forEach(row=>{
      if(row.updated_at>lastPull) lastPull=row.updated_at;
      const str=JSON.stringify(row.data);
      if(lastSent[row.id]===str) return;              // our own echo
      if(row.id==="config"){
        const inc=row.data;
        if(inc.people&&inc.people.length) serverHasRoster=true;
        if(skipNextConfig){ skipNextConfig=false; return; }
        if((!inc.people||!inc.people.length)&&state.people.length){ delete inc.people; delete inc.training; }
        /* a computer that's been set up offline keeps the supervisors it typed in */
        if(joining&&keepSups&&keepSups.length&&inc.supervisors)
          inc.supervisors=inc.supervisors.concat(keepSups.filter(x=>!inc.supervisors.includes(x)));
        Object.assign(state,inc);
      }
      else if(row.id.startsWith("day:")){
        const k=row.id.slice(4), mine=state.days[k];
        if(joining&&mine&&hasContent(mine)){
          if(!hasContent(row.data)) return;                 // blank from elsewhere never wins
          if(JSON.stringify(mine)!==str) replacedDays.push(k);
        }
        state.days[k]=row.data;
      }
      lastSent[row.id]=str; changed=true;
    });
    if(changed){
      store.set("chgc-board",JSON.stringify(state));
      if(editing()) applyQueued=true; else refresh();   // never yank a field mid-type
    } else if(applyQueued&&!editing()){ applyQueued=false; refresh(); }
    if(joining){
      joining=false; keepSups=null;
      if(replacedDays.length){
        const list=replacedDays.slice(0,6).join(", ")+(replacedDays.length>6?"…":"");
        replacedDays=[];
        alert(`Now sharing with the other computers.\n\nThese days were already built on the shared board, `+
          `so everyone's version is what you'll see here: ${list}.\n\nEverything else you'd set up is kept.`);
      }
    }
  }catch(e){ setSync("error"); }
}
/* Connecting a computer that's already had work done on it is the one moment two
   real setups can collide. Ask instead of guessing. */
const rosterNames=list=>(list||[]).map(p=>norm(p.name)).sort().join("|");
async function firstConnect(){
  if(!syncOn()){ startSync(); return; }
  let srv=null;
  try{
    const r=await fetch(api("board?select=id,data&id=eq.config"),{headers:heads()});
    if(r.ok){ const rows=await r.json(); srv=rows[0]&&rows[0].data; }
  }catch(e){}
  const srvPeople=(srv&&srv.people)||[];
  const mine=state.people||[];
  joining=true; keepSups=(state.supervisors||[]).slice(); replacedDays=[];
  if(!srvPeople.length||!mine.length||rosterNames(srvPeople)===rosterNames(mine)){ startSync(); return; }
  askMerge(srv);
}
function mergeConfigs(srv){
  /* union of both sides: nobody disappears, and a machine someone is signed off
     on in either place stays signed off */
  const byName={}; const out=[];
  const take=(p,src)=>{ const k=norm(p.name);
    if(byName[k]){ const ex=byName[k];
      ex.crew=ex.crew||p.crew; ex.hours=(ex.hours===5||p.hours===5)?5:8;
      if(p.custom) ex.custom=Object.assign({},p.custom,ex.custom);
      return ex; }
    const copy=Object.assign({},p); byName[k]=copy; out.push(copy); return copy; };
  const trainMerged={};
  const pull=(list,training)=>{ (list||[]).forEach(p=>{
    const t=take(p); const src=(training||{})[p.id]||{};
    const dest=trainMerged[t.id]=trainMerged[t.id]||{};
    Object.keys(src).forEach(m=>{
      const v=src[m], on=(typeof v==="object")?!!v.on:!!v;
      const cur=dest[m], curOn=cur?((typeof cur==="object")?!!cur.on:!!cur):false;
      if(on&&!curOn) dest[m]=v; else if(!cur) dest[m]=v;
    }); }); };
  pull(mine=state.people,state.training);
  pull(srv.people,srv.training);
  const machines=state.machines.slice();
  (srv.machines||[]).forEach(m=>{ if(!machines.includes(m)) machines.push(m); });
  const sups=(state.supervisors||[]).slice();
  (srv.supervisors||[]).forEach(s=>{ if(!sups.includes(s)) sups.push(s); });
  state.people=out; state.training=trainMerged; state.machines=machines; state.supervisors=sups;
  state.schedule=Object.assign({},srv.schedule||{},state.schedule||{});
  state.trainingIsSample=false;
}
function askMerge(srv){
  const mineN=state.people.length, srvN=(srv.people||[]).length;
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="veil" id="veil"><div class="modal">
    <h5>This computer already has a board set up</h5>
    <p class="sub">There are ${mineN} ${mineN===1?"person":"people"} set up here, and ${srvN} on the shared board.
      Nothing has been changed yet — pick what to do.</p>
    <button class="opt" id="mgMerge"><b>Keep both (recommended)</b><span>Everyone from here and everyone from the shared board.
      Anything either side has signed off stays signed off.</span></button>
    <button class="opt" id="mgMine"><b>Use this computer's version</b><span>What's set up here becomes the shared board for everyone.</span></button>
    <button class="opt" id="mgTheirs"><b>Use the shared board's version</b><span>This computer takes what everyone else already has.
      The setup done here is replaced.</span></button>
    <p class="sub" style="margin-top:12px">Any days already built on this computer are kept either way.</p>
    <div class="foot"><button class="btn" id="mgCancel">Not now</button></div>
  </div></div>`;
  const close=()=>root.innerHTML="";
  document.getElementById("mgCancel").onclick=()=>{ state.sync=null; save(); close(); renderSetup(); };
  document.getElementById("mgTheirs").onclick=()=>{ close(); startSync(); refresh(); };
  document.getElementById("mgMine").onclick=()=>{ skipNextConfig=true; close(); startSync(); refresh(); };
  document.getElementById("mgMerge").onclick=()=>{
    mergeConfigs(srv); save(); skipNextConfig=true; close(); startSync(); refresh();
    alert(`Merged — ${state.people.length} people on the board now. Everything is on the shared board for the others.`);
  };
}
function startSync(){
  clearInterval(pullTimer);
  if(!syncOn()){ setSync("off"); return; }
  lastSent={}; lastPull="1970-01-01T00:00:00Z";
  pullChanges().then(pushDirty);
  pullTimer=setInterval(()=>{ pullChanges(); pushDirty(); },5000);
}

/* ══ shell ══ */
function updateHead(){
  const on=crewsOn(), d=day(), roster=rosterToday();
  document.getElementById("crewToggles").innerHTML=["1","2","3"].map(c=>
    `<button class="crewbtn" data-crew="${c}" data-on="${on.includes(c)?1:0}"
      title="Crew ${c} ${on.includes(c)?"is in":"is off"} — click to change this day">CREW ${c}</button>`).join("");
  /* the crew schedule is imported and eventually runs out — say so plainly
     instead of just showing an empty board */
  const sw=document.getElementById("schedWarn");
  if(sw){
    const keys=Object.keys(state.schedule||{}).sort();
    const lastK=keys[keys.length-1];
    const crewFolk=state.people.some(p=>p.crew&&p.crew!=="MF");
    if(crewFolk&&lastK&&dateKey>lastK){
      sw.hidden=false;
      sw.innerHTML=`<b>The crew schedule runs out after ${esc(lastK)}.</b> Crews 1\u20133 show as off from here on,
        so this board looks empty. Import the new schedule in Setup, or click the crew numbers on the
        calendar there to fill it in. Mon\u2013Fri people and anyone on their own calendar are unaffected.`;
    } else if(crewFolk&&lastK&&dateKey<=lastK
              &&(new Date(lastK+"T00:00:00")-new Date(dateKey+"T00:00:00"))/86400000<=14){
      sw.hidden=false;
      sw.innerHTML=`<b>Heads up \u2014 the crew schedule ends ${esc(lastK)}.</b> Worth importing the next one in
        Setup before then so the boards keep filling themselves in.`;
    } else sw.hidden=true;
  }
  const five=roster.filter(p=>p.hours===5).length, offc=roster.filter(p=>!p.crew).length;
  const away=Object.entries(d.away||{}), called=away.filter(([,a])=>!a.by).length, cov=away.length-called;
  document.getElementById("headcount").innerHTML=
    `<b>${roster.length}</b> in`+(offc?` · ${offc} off-crew`:"")+(five?` · ${five} half`:"")
    +(called?` · <span style="color:var(--out)">${called} called in</span>`:"")
    +(cov?` · <span style="color:var(--turf)">${cov} covered</span>`:"")
    +(!on.length?` · <span style="color:var(--sand)">no schedule for this date</span>`:"");
  document.querySelectorAll("[data-crew]").forEach(b=>b.onclick=()=>{
    const cur=crewsOn().slice(), c=b.dataset.crew;
    state.schedule[dateKey]=cur.includes(c)?cur.filter(x=>x!==c):cur.concat(c).sort();
    save(); refresh(); });
  const dt=new Date(dateKey+"T00:00:00");
  document.getElementById("tvDate").textContent=dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  document.getElementById("tvCrew").textContent=(on.length?on.map(c=>"CREW "+c).join(" + "):"NO CREW SET")+" · "+roster.length+" IN";
}
function tick(){
  document.getElementById("tvClock").textContent=fmt(nowMin())+" MT";
  applyPhase();
  if(view==="board") phaseInfo();
  fitTV();
  if(syncOn()) syncStatus();
}
/* Shrink the board just enough that every job fits one screen on the TVs.
   On tablets the two courses stack, so shrinking would make the text tiny —
   there, keep full size and let people scroll. */
function fitTV(){
  const c=document.getElementById("courses"); if(!c) return;
  if(!document.body.classList.contains("tv")){ c.style.transform=""; c.style.width=""; return; }
  c.style.transform=""; c.style.width="";
  const touch=window.matchMedia&&window.matchMedia("(pointer:coarse)").matches;
  if(touch||window.innerWidth<=1000) return;
  const top=c.getBoundingClientRect().top;
  const avail=window.innerHeight-top-6, h=c.scrollHeight;
  if(h>avail&&h>0){
    const s=Math.max(.35,avail/h);
    c.style.width=(100/s)+"%"; c.style.transform="scale("+s+")";
  }
}
function refresh(){
  document.getElementById("dateInput").value=dateKey;
  document.getElementById("ribbon").hidden=view!=="board";
  updateHead(); applyPhase();
  document.getElementById("viewBoard").hidden=view!=="board";
  document.getElementById("viewHistory").hidden=view!=="history";
  document.getElementById("viewTraining").hidden=view!=="training";
  document.getElementById("viewPeople").hidden=view!=="people";
  document.getElementById("viewTimeoff").hidden=view!=="timeoff";
  document.getElementById("viewSetup").hidden=view!=="setup";
  if(view==="board"){ renderBoard(); renderRibbon(); }
  if(view==="history") renderHistory();
  if(view==="training") renderTraining();
  if(view==="people") renderPeople();
  if(view==="timeoff") renderTimeoff();
  if(view==="setup") renderSetup();
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{ saveTimer=null;
    const wrote=await store.set("chgc-board",JSON.stringify(state));
    if(!wrote) await diskFull();
    pushDirty(); },250);
}
/* flush a pending save when the window closes */
window.addEventListener("beforeunload",()=>{
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; store.set("chgc-board",JSON.stringify(state)); }
});
function shiftDay(n){
  const d=new Date(dateKey+"T00:00:00"); d.setDate(d.getDate()+n);
  dateKey=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  calMonth=dateKey.slice(0,7); refresh();
}
window.addEventListener("resize",fitTV);
document.getElementById("prevDay").onclick=()=>shiftDay(-1);
document.getElementById("nextDay").onclick=()=>shiftDay(1);
document.getElementById("todayBtn").onclick=()=>{ dateKey=todayKey(); refresh(); };
document.getElementById("dateInput").onchange=e=>{ dateKey=e.target.value; calMonth=dateKey.slice(0,7); refresh(); };
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  view=b.dataset.view;
  document.querySelectorAll("[data-view]").forEach(x=>x.setAttribute("aria-selected",x===b));
  refresh(); });
document.getElementById("syncPill").onclick=()=>{
  view="setup";
  document.querySelectorAll("[data-view]").forEach(x=>x.setAttribute("aria-selected",x.dataset.view==="setup"));
  refresh();
  const c=document.getElementById("syncCard"); if(c) c.scrollIntoView({block:"center"});
};
document.getElementById("tvBtn").onclick=()=>{ document.body.classList.add("tv"); fitTV(); };
document.getElementById("tvExit").onclick=()=>{ document.body.classList.remove("tv"); fitTV(); };
document.addEventListener("mousedown",e=>{
  const p=document.getElementById("pickPanel");
  if(p&&!p.contains(e.target)&&!(e.target.closest&&e.target.closest("[data-pick]"))) closePicker();
  const m=document.getElementById("moreMenu");
  if(m&&!m.contains(e.target)&&e.target.id!=="moreBtn") m.remove();
});
document.getElementById("moreBtn").onclick=function(){ openMenu(this); };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closePicker(); const m=document.getElementById("moreMenu"); if(m) m.remove();
    document.body.classList.remove("tv"); fitTV(); document.getElementById("modalRoot").innerHTML=""; } });

(async function init(){
  const raw=await store.get("chgc-board");
  if(raw){ try{ state=JSON.parse(raw); }catch(e){ state=null; } }
  if(!state||!state.schemaV||state.schemaV<3){ state=freshState(); save(); }
  if(state.schemaV===3){
    /* v3 → v4: the job layout changed to match the shop's real sheet.
       People, training, schedule, and saved days all stay. */
    state.schemaV=4;
    state.basics=BASICS.filter(m=>state.machines.includes(m));
    state.jobs=freshJobs();
    save();
  }
  if(state.schemaV===4){
    /* v4 → v5: the column beside each name is the FIRST job (Triplex, Walker, 3100…),
       so each row can now carry its usual choices. Everything else is untouched. */
    ["talons","ridge"].forEach(c=>(state.jobs[c]||[]).forEach(j=>{
      if(!j.opts) j.opts=(JOBOPTS[j.label]||[]).slice(); }));
    state.schemaV=5; save();
  }
  state.basics=state.basics||[];
  /* upgrade older saved boards to the full supervisor list */
  const gi=state.supervisors.indexOf("Geddes");
  if(gi>-1) state.supervisors[gi]="Darion Geddes";
  SUPS.forEach(s=>{ if(!state.supervisors.includes(s)) state.supervisors.push(s); });
  Object.values(state.days).forEach(d=>["talons","ridge"].forEach(c=>{
    if(d[c]&&d[c].supervisor==="Geddes") d[c].supervisor="Darion Geddes"; }));
  refresh(); tick(); setInterval(tick,20000); startSync(); syncStatus();
})();
</script>
